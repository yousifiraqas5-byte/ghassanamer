<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <!-- مناسب لشاشات الآيفون والموبايلات -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>تريلات العراق</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;
        }

        /* رأس الموقع */
        header {
            background: #111;
            color: white;
            padding: 18px 16px;
            padding-top: max(18px, env(safe-area-inset-top));
            text-align: center;
        }

        header h1 {
            font-size: 25px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 14px;
            color: #ccc;
        }

        /* البحث */
        .search-box {
            padding: 15px;
            background: white;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .search-box input {
            width: 100%;
            height: 48px;
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 0 16px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #111;
        }

        /* المحتوى */
        main {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        .section-title {
            font-size: 21px;
            font-weight: bold;
            margin: 8px 0 15px;
        }

        /* بطاقات الأقسام */
        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .category {
            background: white;
            border-radius: 18px;
            padding: 20px 10px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            cursor: pointer;
            transition: transform 0.15s;
        }

        .category:active {
            transform: scale(0.96);
        }

        .category .icon {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .category h3 {
            font-size: 16px;
        }

        .category p {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        /* بطاقة إعلان */
        .truck-card {
            background: white;
            margin-top: 15px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .truck-image {
            width: 100%;
            height: 190px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .truck-info {
            padding: 15px;
        }

        .truck-info h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .truck-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .button {
            display: block;
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 13px;
            margin-top: 12px;
            background: #111;
            color: white;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
        }

        /* أسفل الصفحة */
        footer {
            text-align: center;
            padding: 30px 15px;
            padding-bottom: max(30px, env(safe-area-inset-bottom));
            color: #777;
            font-size: 13px;
        }

        /* آيفون صغير */
        @media (max-width: 375px) {
            header h1 {
                font-size: 22px;
            }

            .categories {
                gap: 8px;
            }

            .category {
                padding: 16px 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🚛 تريلات العراق</h1>
    <p>دليل التريلات والخدمات في العراق</p>
</header>

<div class="search-box">
    <input type="search" placeholder="🔍 ابحث عن تريلة أو خدمة...">
</div>

<main>

    <h2 class="section-title">الأقسام</h2>

    <div class="categories">

        <div class="category">
            <div class="icon">🚛</div>
            <h3>تريلات للبيع</h3>
            <p>تصفح التريلات</p>
        </div>

        <div class="category">
            <div class="icon">🚚</div>
            <h3>تريلات للإيجار</h3>
            <p>إيجار التريلات</p>
        </div>

        <div class="category">
            <div class="icon">🔧</div>
            <h3>تصليح وصيانة</h3>
            <p>ورش وخدمات</p>
        </div>

        <div class="category">
            <div class="icon">🛞</div>
            <h3>قطع غيار</h3>
            <p>قطع ومستلزمات</p>
        </div>

    </div>

    <h2 class="section-title" style="margin-top:25px;">
        أحدث الإعلانات
    </h2>

    <div class="truck-card">

        <div class="truck-image">
            🚛
        </div>

        <div class="truck-info">
            <h3>تريلة للبيع</h3>
            <p>📍 بغداد</p>
            <p>💰 السعر: اتصل لمعرفة السعر</p>

            <a href="#" class="button">
                عرض التفاصيل
            </a>
        </div>

    </div>

</main>

<footer>
    © 2026 تريلات العراق
</footer>

</body>
</html>
